<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- Estilo de la barra de estado real del iPhone. Se elige en el menú oculto (Barra de estado):
     "default" = texto oscuro, la barra toma el color de fondo de cada pantalla.
     "black-translucent" = texto blanco, la app se dibuja por debajo de la barra.
     "auto" = arranca en "default" y prueba cambiar por pantalla (experimental).
     iOS lee este valor al abrir la app: después de cambiarlo hay que cerrar y volver a abrir la app. -->
<script>
(function () {
  var m = 'default';
  try { m = localStorage.getItem('invisible-barra-v2') || 'default'; } catch (e) {}
  document.write('<meta name="apple-mobile-web-app-status-bar-style" content="' + (m === 'auto' ? 'default' : m) + '">');
})();
</script>
<meta name="apple-mobile-web-app-title" content="Invisible">
<meta name="theme-color" content="#4A6AA8">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="stylesheet" href="css/app.css">
<title>Invisible</title>
</head>
<body>
<div id="app"></div>
<div id="banner-layer"></div>
<div id="menu-layer"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
